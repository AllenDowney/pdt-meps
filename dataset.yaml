# The dataset, its terms and its releases (STANDARD.md §2.1, §8).
# Schema: PublicDataToolkit/schema/dataset.schema.json. Edited by hand.
standard_version: "0.1"
id: meps
title: "Medical Expenditure Panel Survey, Household Component (MEPS-HC)"
kind: survey
publisher:
  name: "Agency for Healthcare Research and Quality (AHRQ)"
  url: "https://www.ahrq.gov/"
url: "https://meps.ahrq.gov/mepsweb/"
description: "AHRQ\u0027s survey of health care use, expenditures, sources of payment and insurance coverage of the US civilian noninstitutionalized population, from overlapping two-year panels, released as annual person-level and event-level files."
citation: "Agency for Healthcare Research and Quality. Medical Expenditure Panel Survey, Household Component. Rockville, MD."
# Terms are decided by a person, never by an agent (STANDARD.md §8). Recorded by Claude
# (PublicDataToolkit Task 64), 2026-11-20; `unknown` until Allen decides.
terms:
  url: https://meps.ahrq.gov/mepsweb/data_stats/download_data_files.jsp
  summary: 'Not yet decided. What AHRQ says (each file''s documentation, section A, "Data Use Agreement"): "Individual
    identifiers have been removed from the micro-data contained in these files. Nevertheless, under Sections 308
    (d) and 903 (c) of the Public Health Service Act ... data collected by [AHRQ] and/or [NCHS] may not be used
    for any purpose other than the purpose for which they were supplied; any effort to determine the identity of
    any reported cases is prohibited by law." Users agree: "No one is to use the data in this dataset in any way
    except for statistical reporting and analysis"; to report and not use an identity discovered inadvertently;
    and "No one will attempt to link this dataset with individually identifiable records from any datasets other
    than the Medical Expenditure Panel Survey or the National Health Interview Survey", with MEPS-NHIS linkage only
    in an AHRQ, NCHS or Census data center. "By using these data, you signify your agreement to comply ..." "The
    AHRQ requests that users cite AHRQ and the Medical Expenditure Panel Survey as the data source." The agreement
    says nothing about redistributing the files; the download pages have no login or click-through. The documentation
    is a federal work.'
  data: unknown
  documentation: unknown
  metadata: unknown
  llm_processing: unknown
